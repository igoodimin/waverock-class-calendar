# 무료 Supabase 프로젝트가 장기 미사용으로 멈추지 않도록 3일마다 데이터를 한 번 읽습니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 0 */3 * *'   # 3일마다 09:17 (한국 시간)
  workflow_dispatch:
  push:
    paths: ['.github/workflows/supabase-keepalive.yml']

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase에 접속
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" config.js)
          curl -fsS "$URL/rest/v1/calendar_courses?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

      # GitHub은 60일간 저장소 활동이 없으면 예약 실행을 끕니다. 스스로 다시 켜 둡니다.
      - name: 예약 실행 유지
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
